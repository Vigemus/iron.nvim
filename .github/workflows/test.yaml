name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Neovim ${{ matrix.nvim }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nvim:
          - v0.11.4
          - v0.12.2

    env:
      NVIM_TAG: ${{ matrix.nvim }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          bash .github/workflows/install_nvim.sh

      - name: Show environment
        run: |
          set -eux

          export PATH="$HOME/.local/bin:$PATH"

          echo "Working directory:"
          pwd

          echo
          echo "Repository contents:"
          ls -la

          echo
          echo "Makefile:"
          cat Makefile

          echo
          echo "Neovim:"
          which nvim
          nvim --version

      - name: Run tests
        run: |
          set -eux

          export PATH="$HOME/.local/bin:$PATH"

          make test
