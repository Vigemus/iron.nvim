name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Neovim ${{ matrix.nvim }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nvim:
          - "0.11"
          - "0.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Neovim
        run: |
          set -eux

          python -m pip install "fast-nvim-release==${{ matrix.nvim }}.*"
          fast-nvim-release setup --prefix "$HOME/.local"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show environment
        run: |
          set -eux

          export PATH="$HOME/.local/bin:$PATH"

          echo "Working directory:"
          pwd

          echo
          echo "Repository contents:"
          ls -la

          echo
          echo "Makefile:"
          cat Makefile

          echo
          echo "Neovim:"
          which nvim
          nvim --version

      - name: Run tests
        run: |
          set -eux

          export PATH="$HOME/.local/bin:$PATH"

          make test
